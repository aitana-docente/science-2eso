<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expedición Periódica</title>
<meta name="description" content="Juego para estudiar los elementos representativos de la tabla periódica (2º ESO).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   1. TOKENS Y BASE
   ========================================================= */
:root{
  --bg:#f7f8fc; --surface:#fff; --ink:#172033; --muted:#566074; --line:#e0e4ee; --soft:#eef1f8;
  --blue:#0055cc; --green:#167a3b; --orange:#c84800; --amber:#8a5900; --red:#c62828;
  --r-sm:12px; --r:14px; --r-lg:16px;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 6px 18px rgba(20,30,60,.07);
  --f-title:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-text:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --hdr:58px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f-text);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-title);letter-spacing:-.01em;margin:0;line-height:1.15}
h1{font-size:24px} h2{font-size:20px} h3{font-size:17px}
p{margin:0}
button{font:inherit;color:inherit}
[tabindex="-1"]:focus{outline:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.muted{color:var(--muted)}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd{font-family:var(--f-title);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;background:#fff;color:var(--muted)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,transform .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{border-color:#c4cadc;background:#f3f5fb}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#0047ab}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:20px;height:20px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;background:var(--soft);font-weight:600;font-size:14px;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}

/* Estrellas */
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.star{width:18px;height:18px;fill:#d9dde8}
.star.on{fill:#e0a100}
.stars.big .star{width:34px;height:34px}

/* =========================================================
   2. CABECERA
   ========================================================= */
.topbar{height:var(--hdr);flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-title);font-weight:700;font-size:18px;background:none;border:0;cursor:pointer;min-height:44px;padding:0 8px;border-radius:12px}
.brand svg{width:30px;height:30px}
.topnav{margin-left:auto;display:flex;gap:6px;align-items:center}
.topnav .btn{padding:0 12px}
.topnav .btn[aria-current="page"]{background:#e8f0fc;border-color:#bcd3f5;color:var(--blue)}
#btnSound[aria-pressed="true"]{color:var(--green);border-color:#a9d6b9;background:#eaf6ee}
@media (max-width:860px){ .topnav .lbl{display:none} .brand .lbl{display:none} }

main#app{flex:1;min-height:0;overflow:auto;position:relative}
.screen{min-height:100%;height:100%;padding:14px 20px 16px;display:flex;flex-direction:column;gap:12px;max-width:1340px;margin:0 auto}
.screen-in{animation:fadeIn .28s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar .grow{flex:1;min-width:0}
.banner-error{background:#fdecea;color:#8c1d18;padding:10px 16px;font-weight:600;border-bottom:1px solid #f3c1bc}

/* =========================================================
   3. MAPA
   ========================================================= */
/* Lienzo del mapa: "espacio" claro con nebulosas, átomos y fichas flotando */
.map-canvas{position:relative;flex:1;min-height:380px;border-radius:20px;overflow:hidden;isolation:isolate;border:1px solid #dde3f3;
  background:linear-gradient(160deg,#eaf0ff 0%,#f5f1ff 48%,#ebf8f1 100%)}
.map-bg{position:absolute;inset:0;pointer-events:none;z-index:0}
/* Nebulosas: degradados radiales (sin filter:blur, más ligero para los Chromebooks) */
.blob{position:absolute;width:56%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--c) 0,transparent 68%);opacity:.85;animation:blob 26s ease-in-out infinite alternate;will-change:transform}
.blob.b1{left:-16%;top:-36%;--c:#b9d0ff}
.blob.b2{right:-18%;bottom:-40%;--c:#d6c4ff;animation-duration:32s}
.blob.b3{left:34%;top:18%;width:40%;--c:#c3eed5;animation-duration:21s}
@keyframes blob{to{transform:translate(9%,12%) scale(1.15)}}
.spark{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px rgba(110,145,255,.55);animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.15;transform:scale(.4)}}
.atom{position:absolute;transform:translate(-50%,-50%);opacity:.3}
.atom svg{width:100%;height:100%;overflow:visible;animation:spin var(--spin,60s) linear infinite}
.atom.rev svg{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.float-card{position:absolute;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.22);display:grid;place-items:center;font-family:var(--f-title);font-weight:700;font-size:calc(var(--s)*.46);
  color:color-mix(in srgb,var(--gc) 85%,#000);background:color-mix(in srgb,var(--gc) 12%,#fff);border:2px solid color-mix(in srgb,var(--gc) 45%,#fff);
  filter:blur(var(--b));opacity:var(--o,.5);animation:drift var(--t,20s) ease-in-out infinite;animation-delay:var(--dl,0s);will-change:transform}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(var(--r))}25%{transform:translate(22px,-26px) rotate(calc(var(--r) + 8deg))}50%{transform:translate(-4px,-48px) rotate(var(--r))}75%{transform:translate(-24px,-20px) rotate(calc(var(--r) - 8deg))}}
.shoot{position:absolute;top:8%;left:-12%;width:140px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#8fb0ff 70%,#fff);opacity:0;animation:shoot 11s ease-in 4s infinite}
@keyframes shoot{0%{transform:translate(0,0) rotate(17deg);opacity:0}3%{opacity:.9}11%,100%{transform:translate(85vw,26vw) rotate(17deg);opacity:0}}
.map-path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.map-path line{stroke:#b4bfd8;stroke-width:3;stroke-dasharray:1 10;stroke-linecap:round;vector-effect:non-scaling-stroke}
.map-path line.done{stroke:var(--blue);stroke-dasharray:10 8;opacity:.5;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
.node{position:absolute;z-index:2;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:6px 8px;border-radius:16px;min-width:116px;text-align:center}
.node:hover .orb{transform:scale(1.08)}
/* Planeta: esfera con sombra, superficie que gira, anillo y una pequeña luna */
.orb{--size:74px;width:var(--size);height:var(--size);border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-title);font-weight:700;font-size:26px;position:relative;
  background:radial-gradient(circle at 32% 28%,color-mix(in srgb,var(--gc) 40%,#fff) 0,var(--gc) 62%,color-mix(in srgb,var(--gc) 80%,#000) 100%);
  box-shadow:inset -9px -11px 18px rgba(0,0,0,.25),inset 5px 5px 12px rgba(255,255,255,.22),0 10px 22px color-mix(in srgb,var(--gc) 32%,transparent);transition:transform .25s}
.orb::before{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 18% 30%,rgba(255,255,255,.22) 0 5px,transparent 6px),radial-gradient(circle at 68% 62%,rgba(0,0,0,.13) 0 8px,transparent 9px),radial-gradient(circle at 42% 88%,rgba(255,255,255,.15) 0 3px,transparent 4px),radial-gradient(circle at 88% 18%,rgba(0,0,0,.1) 0 4px,transparent 5px);
  background-size:64px 64px;-webkit-mask:radial-gradient(circle at 42% 40%,#000 40%,transparent 72%);mask:radial-gradient(circle at 42% 40%,#000 40%,transparent 72%);animation:surface 9s linear infinite}
@keyframes surface{to{background-position:-64px 0}}
.orb::after{content:"";position:absolute;left:-13px;right:-13px;top:50%;height:18px;margin-top:-9px;border-radius:50%;border:3px solid color-mix(in srgb,var(--gc) 45%,#fff);border-top-color:color-mix(in srgb,var(--gc) 25%,transparent);transform:rotate(-16deg);opacity:.8;pointer-events:none;animation:ring 7s ease-in-out infinite}
@keyframes ring{50%{transform:rotate(-9deg) scaleX(1.05)}}
.orb span{position:relative;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.orb .moon,.orb .lock-ico,.orb .done-tick{position:absolute}
.map .node .orb{animation:bob 4.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes bob{50%{translate:0 -8px}}
.moon{position:absolute;inset:-17px;border-radius:50%;pointer-events:none;z-index:2;animation:spin var(--md,7s) linear infinite}
.moon::before{content:"";position:absolute;top:0;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px color-mix(in srgb,var(--gc) 55%,#fff),0 0 10px 2px rgba(255,255,255,.9)}
.node-text{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.82);padding:4px 10px 5px;border-radius:12px;box-shadow:0 1px 4px rgba(20,30,60,.08)}
.node-name{font-family:var(--f-title);font-weight:700;font-size:15px;line-height:1.1}
.node-sub{font-size:12px;color:var(--muted)}
.node.locked{cursor:not-allowed}
.node.locked .orb{filter:grayscale(1);opacity:.5}
.node.locked .orb::before,.node.locked .orb::after{animation:none}
.node.locked .node-name{color:var(--muted)}
.lock-ico{position:absolute;right:-4px;bottom:-4px;width:28px;height:28px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;z-index:2}
.lock-ico svg{width:15px;height:15px;fill:var(--muted)}
.map .node.current .orb{animation:bob 4.6s ease-in-out infinite,pulse 2s ease-in-out infinite;animation-delay:var(--d,0s),0s}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gc) 45%,transparent),0 8px 18px color-mix(in srgb,var(--gc) 30%,transparent)}50%{box-shadow:0 0 0 12px transparent,0 8px 18px color-mix(in srgb,var(--gc) 30%,transparent)}}
.node.hnode .orb{--size:56px;font-size:22px;background:#fff;color:#4a5468;border:3px dashed #8a93a8;box-shadow:none}
.node.hnode .orb::after,.node.hnode .orb::before{display:none}
.node.hnode .orb span{text-shadow:none}
.node.boss .orb{--size:84px;background:radial-gradient(circle at 32% 28%,#4b84e0 0,#0055cc 55%,#002f73 100%)}
.node.boss .orb::after{left:-12px;right:-12px;top:-12px;bottom:-12px;height:auto;margin:0;border:2px dashed rgba(0,85,204,.5);transform:none;animation:spin 20s linear infinite}
.node.boss.locked .orb::after{animation:none}
.next-pill{background:#e8f0fc;color:var(--blue)}
.node.boss .orb svg{width:38px;height:38px;fill:#fff;position:relative;z-index:1}
.done-tick{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:var(--green);display:grid;place-items:center;z-index:2;border:2px solid #fff}
.done-tick svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:3}
.map-legend{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:760px){
  .map-canvas{display:flex;flex-direction:column;gap:6px;padding:10px;min-height:0}
  .map-path{display:none}
  .node{position:static;transform:none;flex-direction:row;justify-content:flex-start;gap:14px;text-align:left;width:100%;background:#fff;border:1px solid var(--line)}
  .node .orb{--size:52px;font-size:20px}
  .node.boss .orb{--size:52px}
  .node-text{display:flex;flex-direction:column;align-items:flex-start;background:none;box-shadow:none;padding:0}
  .node .moon{inset:-12px}
  .map .node .orb{animation:none}
  .map-bg .extra{display:none}
}

/* =========================================================
   4. PLANETA
   ========================================================= */
.planet-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.planet-head .orb{--size:56px;font-size:22px}
.planet-body{display:grid;grid-template-columns:minmax(230px,300px) 1fr;gap:16px;flex:1;min-height:0}
.study{padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
.study ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.study li{display:flex;align-items:center;gap:10px}
.tile{width:44px;height:44px;flex:none;border-radius:10px;display:grid;place-items:center;font-family:var(--f-title);font-weight:700;font-size:19px;background:color-mix(in srgb,var(--gc) 12%,#fff);color:color-mix(in srgb,var(--gc) 85%,#000);border:2px solid color-mix(in srgb,var(--gc) 55%,#fff)}
.tile.h{--gc:#5c667c;border-style:dashed}
.note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 10px}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-content:start}
.game-card{padding:16px;display:flex;flex-direction:column;gap:10px}
.game-ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--gc) 12%,#fff)}
.game-ico svg{width:30px;height:30px;stroke:var(--gc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.game-card .best{font-size:14px}
.game-card .btn{margin-top:auto}
.meter{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.meter > i{display:block;height:100%;background:var(--gc);border-radius:99px;transition:width .4s}
.rules{font-size:13px;color:var(--muted)}
@media (max-width:980px){ .games{grid-template-columns:1fr} }
@media (max-width:760px){ .planet-body{grid-template-columns:1fr} .screen{height:auto} }

/* =========================================================
   5. RONDA RÁPIDA / PRÁCTICA (preguntas)
   ========================================================= */
.quiz-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.quiz-title{flex:1;min-width:180px}
.quiz-stats{display:flex;gap:8px;flex-wrap:wrap}
.lives svg{width:20px;height:20px;fill:var(--red)}
.lives svg.off{fill:#d9dde8}
.combo{background:#fff3e6;color:var(--orange)}
.combo.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.15)}}
.qtimer{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.qtimer > div{height:100%;width:100%;background:var(--blue);border-radius:99px;transform-origin:left}
.qtimer.low > div{background:var(--orange)}
.qcard{padding:22px;text-align:center;border-top:6px solid var(--gc)}
.quiz .qcard{margin-top:auto}
.quiz .qfoot{margin-bottom:auto}
.qtype{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:color-mix(in srgb,var(--gc) 85%,#000)}
.qtext{font-size:26px;margin-top:6px}
.sym-inline{display:inline-grid;place-items:center;min-width:64px;height:58px;padding:0 10px;border-radius:12px;font-size:34px;vertical-align:middle;background:color-mix(in srgb,var(--gc) 10%,#fff);border:2px solid color-mix(in srgb,var(--gc) 50%,#fff)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:860px;width:100%;margin:0 auto}
.opt{min-height:64px;display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:var(--r);border:2px solid var(--line);background:#fff;cursor:pointer;font-size:18px;font-weight:600;text-align:left;transition:border-color .15s,background .15s,transform .12s}
.opt:hover:not([disabled]){border-color:#9db9e6;background:#f5f8fe}
.opt .lbl{flex:1}
.opt.symopt .lbl{font-family:var(--f-title);font-size:26px}
.opt.ok{border-color:var(--green);background:#e8f5ec;color:#0f5a2a}
.opt.bad{border-color:var(--red);background:#fdecea;color:#8c1d18}
.opt.elim{opacity:.35}
.opt[disabled]{cursor:default}
.qfoot{display:flex;align-items:center;gap:12px;min-height:48px;max-width:860px;width:100%;margin:0 auto}
.feedback{flex:1;font-weight:600;min-height:24px}
.feedback.ok{color:var(--green)} .feedback.bad{color:var(--red)}
.qfoot-actions{display:flex;gap:8px}
@media (max-width:640px){ .options{grid-template-columns:1fr} .qtext{font-size:21px} }
@media (max-height:700px) and (min-width:761px){ .qcard{padding:14px} .opt{min-height:56px} }

/* =========================================================
   6. PAREJAS
   ========================================================= */
.mgrid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-auto-rows:minmax(64px,1fr);gap:12px;flex:1;min-height:0;max-height:470px;width:100%;max-width:820px;margin:0 auto}
.mcard{position:relative;border:0;padding:0;background:none;cursor:pointer;perspective:900px;border-radius:var(--r);min-height:64px}
.mcard .in{position:absolute;inset:0;transition:transform .38s ease;transform-style:preserve-3d}
.mcard.up .in{transform:rotateY(180deg)}
.mcard .face{position:absolute;inset:0;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:6px}
.mcard .back{background:linear-gradient(135deg,#0055cc,#2a6fd6);box-shadow:var(--shadow)}
.mcard .back svg{width:40%;max-width:56px;opacity:.35}
.mcard .front{transform:rotateY(180deg);background:#fff;border:2px solid color-mix(in srgb,var(--gc) 55%,#fff);box-shadow:var(--shadow)}
.mcard .front .s{font-family:var(--f-title);font-weight:700;font-size:clamp(26px,4vw,40px);color:color-mix(in srgb,var(--gc) 85%,#000)}
.mcard .front .n{font-weight:700;font-size:clamp(15px,1.8vw,20px)}
.mcard .front small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mcard.matched .front{background:color-mix(in srgb,var(--gc) 12%,#fff);border-color:var(--gc)}
.mcard.wrong .front{border-color:var(--red);background:#fdecea}
.mcard[disabled]{cursor:default}

/* =========================================================
   7. ARRASTRAR Y SOLTAR (columna y prueba final)
   ========================================================= */
[data-item]{touch-action:none;-webkit-user-select:none;user-select:none}
.is-selected{outline:3px solid var(--blue)!important;outline-offset:2px;box-shadow:0 0 0 6px rgba(0,85,204,.15)!important}
.is-dragging{opacity:.35}
.dnd-ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;opacity:.95;box-shadow:0 10px 24px rgba(20,30,60,.25)!important;margin:0!important}
.selecting [data-drop]:not(.tray):not([data-item]),.selecting .drop-empty{border-style:dashed!important;border-color:var(--blue)!important}
.drop-hover{background:#e3edfc!important;border-color:var(--blue)!important}
@media (pointer:coarse) and (max-width:760px){ [data-item]{touch-action:manipulation} }

.chip{min-width:56px;min-height:52px;padding:4px 10px;border-radius:12px;border:2px solid color-mix(in srgb,var(--gc,#8a93a8) 55%,#fff);background:#fff;cursor:grab;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;box-shadow:0 1px 2px rgba(20,30,60,.08)}
.chip b{font-family:var(--f-title);font-size:22px;color:color-mix(in srgb,var(--gc,#30384a) 85%,#000)}
.chip small{font-size:12px;color:var(--muted)}
.tray{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:12px;border-radius:var(--r-lg);background:#fff;border:2px dashed var(--line);min-height:80px}
.col-body{display:flex;gap:24px;flex:1;min-height:0;align-items:stretch;justify-content:center}
.colwrap{display:flex;flex-direction:column;gap:6px;width:250px;flex:none}
.colhead{text-align:center;padding:8px;border-radius:12px;background:var(--gc);color:#fff;font-family:var(--f-title)}
.colhead b{font-size:18px}

<script>
'use strict';
/* =========================================================================
   EXPEDICIÓN PERIÓDICA · juego de los elementos representativos (2º ESO)
   Índice del código:
     1. DATOS (grupos, elementos, confusiones típicas)
     2. AUTOCOMPROBACIÓN del dataset y del generador de preguntas
     3. UTILIDADES (barajar, tiempos, sonido, diálogos, avisos)

     6. ARRASTRAR/SOLTAR con alternativa "tocar y colocar" + teclado

   ========================================================================= */

/* ===================== 1. DATOS ===================== */
const GROUPS = [

const GROUP = Object.fromEntries(GROUPS.map(g => [g.num, g]));
const NO_GROUP = 'A ninguno';

// [nombre, símbolo, grupo (o null), periodo]  — dataset cerrado: 44 elementos
const RAW = [
  ['Hidrógeno', 'H', null, 1],
  ['Litio', 'Li', 1, 2], ['Sodio', 'Na', 1, 3], ['Potasio', 'K', 1, 4], ['Rubidio', 'Rb', 1, 5], ['Cesio', 'Cs', 1, 6], ['Francio', 'Fr', 1, 7],

const ELEMENTS = RAW.map(([name, symbol, group, period]) => ({

const BY_SYMBOL = Object.fromEntries(ELEMENTS.map(e => [e.symbol, e]));
const HYDROGEN = BY_SYMBOL.H;
const elementsOf = g => ELEMENTS.filter(e => e.group === g).sort((a, b) => a.period - b.period);

// Valores esperados (para la autocomprobación)

  periods: { 1: [2, 7], 2: [2, 7], 13: [2, 6], 14: [2, 6], 15: [2, 6], 16: [2, 6], 17: [2, 6], 18: [1, 6] } };

// Se usan PRIMERO al elegir distractores.
const CONF = {
  H: ['He', 'Hi', 'Hd'], Li: ['L', 'Lt', 'Le'], Na: ['So', 'S', 'N', 'Sd'], K: ['P', 'Po', 'Ka', 'Kr'], Rb: ['Ra', 'Rn', 'Ru', 'Rd'], Cs: ['Ca', 'Ce', 'C', 'Cl'], Fr: ['F', 'Fa', 'Fn', 'Fc'],

// Minijuegos de cada planeta y tiempos objetivo (segundos) para la 3ª estrella
const GAMES = {

  quiz: { title: 'Ronda rápida',          desc: '10 preguntas, 3 vidas y combo por racha.', target: () => 90 },

const GAME_KEYS = Object.keys(GAMES);
const QUIZ_PER_Q = 12;      // segundos por pregunta en la ronda rápida

const TYPE_LABEL = { sym2name: 'Símbolo → nombre', name2sym: 'Nombre → símbolo', elem2group: 'Elemento → grupo', group2num: 'Grupo → número', notin: '¿Cuál no pertenece?' };

const $ = (s, r = document) => r.querySelector(s);

// Temporizadores ligados a la pantalla actual (se limpian al cambiar de pantalla)

// Sonido con Web Audio (silenciado por defecto)
const Sound = {
  ctx: null,
  play(kind) {
    if (!S.sound) return;

      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();

/* ===================== 4. ESTADO Y GUARDADO ===================== */

/* ===================== 2. AUTOCOMPROBACIÓN ===================== */
function selfTest(rounds = 40) {
  const errs = []; const fail = m => errs.push(m);
  if (ELEMENTS.length !== EXPECTED.total) fail(`Hay ${ELEMENTS.length} elementos (deben ser 44).`);
  for (const [g, n] of Object.entries(EXPECTED.counts)) {
    const els = elementsOf(+g);
    if (els.length !== n) fail(`El grupo ${g} tiene ${els.length} elementos (deben ser ${n}).`);
    const [a, b] = EXPECTED.periods[g];
    els.forEach((e, i) => { if (e.period !== a + i) fail(`${e.name}: periodo ${e.period} incorrecto.`); if (e.groupName !== GROUP[g].name) fail(`${e.name}: nombre de grupo incorrecto.`); });
    if (els.length && els[els.length - 1].period !== b) fail(`Grupo ${g}: el último periodo debería ser ${b}.`);
  }
  if (HYDROGEN.group !== null || HYDROGEN.period !== 1 || HYDROGEN.groupName !== null) fail('El hidrógeno debe tener grupo null y periodo 1.');
  if (ELEMENTS.filter(e => e.group === null).length !== 1) fail('Solo el hidrógeno puede no tener grupo.');
  if (new Set(ELEMENTS.map(e => e.symbol)).size !== 44) fail('Hay símbolos repetidos.');
  if (new Set(ELEMENTS.map(e => e.name)).size !== 44) fail('Hay nombres repetidos.');
  if (elementsOf(1).includes(HYDROGEN)) fail('El hidrógeno aparece como alcalino.');
  const check = q => {
    const labels = q.options.map(o => o.label);
    if (q.options.length !== 4) fail(`${q.sig}: no tiene 4 opciones.`);
    if (new Set(labels).size !== labels.length) fail(`${q.sig}: opciones repetidas (${labels}).`);
    const ok = q.options.filter(o => o.ok); if (ok.length !== 1) { fail(`${q.sig}: ${ok.length} correctas.`); return; }
    const c = ok[0].label, e = q.meta.el;
    if (q.type === 'sym2name' && c !== e.name) fail(`${q.sig}: respuesta incorrecta.`);
    if (q.type === 'name2sym' && c !== e.symbol) fail(`${q.sig}: respuesta incorrecta.`);
    if (q.type === 'elem2group' && c !== (e.group === null ? NO_GROUP : e.groupName)) fail(`${q.sig}: grupo incorrecto.`);
    if (q.type === 'group2num' && c !== 'Grupo ' + q.meta.g) fail(`${q.sig}: número incorrecto.`);
    if (q.type === 'notin') {
      if (q.meta.out.group === q.meta.g) fail(`${q.sig}: la respuesta sí es del grupo.`);
      if (q.meta.ins.some(x => x.group !== q.meta.g)) fail(`${q.sig}: hay un "intruso" entre los del grupo.`);
      if (q.meta.ins.includes(HYDROGEN)) fail(`${q.sig}: el H aparece como miembro de un grupo.`);
    }
    if ((q.type === 'sym2name' || q.type === 'name2sym') && q.meta.el.symbol === 'H' && false) fail('');
  };

    for (let r = 0; r < rounds; r++) {
      ORDER.forEach(g => ['sym2name', 'name2sym', 'elem2group', 'group2num', 'notin'].forEach(t => check(planetQuestion(g, t))));
      ['sym2name', 'name2sym', 'elem2group'].forEach(t => check(Q[t](HYDROGEN)));
      check(practiceQuestion({ groups: ['H', ...ORDER], type: 'mix', onlyMiss: false }));

// Elementos con [data-item] se pueden arrastrar o seleccionar con un toque/clic/Intro.

function attachDnD(root, opts) {

      ghost.classList.add('dnd-ghost'); ghost.classList.remove('is-selected'); ghost.style.width = r.width + 'px'; ghost.style.height = r.height + 'px';
      document.body.appendChild(ghost); setSel(drag.id); drag.el.classList.add('is-dragging');
    }

    const t = targetAt(e.clientX, e.clientY);

const app = $('#app');
function show(html, cls = '') {
  clearScreen(); // cada pantalla nueva detiene los temporizadores de la anterior
  app.innerHTML = `<section class="screen ${cls}${reducedMotion() ? '' : ' screen-in'}">${html}</section>`;
  app.scrollTop = 0;
  const h = app.querySelector('h1, h2');
  if (h) { h.setAttribute('tabindex', '-1'); try { h.focus({ preventScroll: true }); } catch (e) { h.focus(); } }
  return app.firstElementChild;
}
const ROUTES = {};
function go(name, arg) {
  clearScreen();
  (ROUTES[name] || ROUTES.map)(arg);
  $$('[data-nav]').forEach(b => { if (b.dataset.nav === name) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b) return;

/* ---------- 7.1 MAPA ---------- */
const MAP_POS = { H: [6, 30], 1: [20, 26], 2: [35, 17], 13: [50, 27], 14: [66, 17], 15: [84, 29], 16: [80, 74], 17: [62, 81], 18: [44, 74], final: [23, 75] };
// Fondo decorativo del mapa: nebulosas, átomos con electrones en órbita, fichas de símbolos
// flotando desenfocadas (más grandes = más cerca = más borrosas), destellos y una estrella fugaz.
function mapBackdrop() {
  const rm = reducedMotion(), rnd = (a, b) => a + Math.random() * (b - a);
  const orbit = 'M44,0 A44,15 0 1,1 -44,0 A44,15 0 1,1 44,0';
  const atom = (c, n, speed) => `<svg viewBox="-50 -50 100 100">${[0, 60, 120].slice(0, n).map((a, i) =>
    `<g transform="rotate(${a})"><path d="${orbit}" fill="none" stroke="${c}" stroke-width="1.6"/>
      <circle r="3.8" fill="${c}"${rm ? ' cx="44"' : ''}>${rm ? '' : `<animateMotion dur="${(speed + i * 1.4).toFixed(1)}s" begin="-${(i * 1.1).toFixed(1)}s" repeatCount="indefinite" path="${orbit}"/>`}</circle></g>`).join('')}
    <circle r="8" fill="${c}"/><circle r="3" cx="-2.5" cy="-2.5" fill="#fff" opacity=".6"/></svg>`;
  const ATOMS = [[9, 80, 130, '#0055cc', 3, 4], [50, 50, 170, '#6741d9', 3, 5], [94, 14, 110, '#167a3b', 2, 3.5], [30, 6, 80, '#c84800', 2, 3], [72, 95, 120, '#a61e4d', 3, 4.5], [66, 46, 70, '#0b7285', 1, 2.8]];
  const atoms = ATOMS.map(([x, y, s, c, n, sp], i) =>
    `<div class="atom${i % 2 ? ' rev' : ''}${i >= 3 ? ' extra' : ''}" style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;--spin:${40 + i * 9}s">${atom(c, n, sp)}</div>`).join('');
  const cards = shuffle(ELEMENTS).slice(0, 16).map((e, i) => {
    const s = rnd(28, 64), t = rnd(16, 30);
    return `<span class="float-card${i >= 7 ? ' extra' : ''}" style="left:${rnd(2, 94).toFixed(1)}%;top:${rnd(4, 90).toFixed(1)}%;--gc:${colorOf(e)};--s:${s.toFixed(0)}px;--b:${(0.4 + (s - 28) / 36 * 3).toFixed(1)}px;--o:${(0.6 - (s - 28) / 36 * 0.25).toFixed(2)};--r:${rnd(-18, 18).toFixed(0)}deg;--t:${t.toFixed(1)}s;--dl:-${rnd(0, t).toFixed(1)}s">${e.symbol}</span>`;
  }).join('');
  const sparks = Array.from({ length: 22 }, () => { const z = rnd(2, 4.5).toFixed(1);
    return `<span class="spark" style="left:${rnd(1, 99).toFixed(1)}%;top:${rnd(1, 99).toFixed(1)}%;width:${z}px;height:${z}px;animation-delay:-${rnd(0, 3).toFixed(1)}s"></span>`; }).join('');
  return `<div class="map-bg" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>${atoms}${cards}${sparks}<span class="shoot"></span></div>`;
}
ROUTES.map = function () {

    const [x1, y1] = MAP_POS[path[i]], [x2, y2] = MAP_POS[k];

  }).join('');
  const current = ORDER.find(g => isUnlocked(g) && planetStars(g) === 0) ?? (finalUnlocked() && !S.final ? 'final' : null);
  const nodes = ORDER.map(g => {

      <span class="node-text"><span class="node-name">Prueba final</span><span class="node-sub">${S.final ? `Récord: ${S.final.score}/${S.final.total}` : 'La tabla completa'}</span>${starsHTML(fs)}</span>
    </button>`;
  const [hx, hy] = MAP_POS.H;
  const hnode = `<button class="node hnode" style="left:${hx}%;top:${hy}%" data-go="hydrogen" aria-label="Hidrógeno, sin grupo${S.hDone ? ', reto completado' : ''}">

  show(`
    <div class="bar">
      <div class="grow"><h1>Mapa de la expedición</h1><p class="muted">Gana al menos 1 estrella en cada planeta para desbloquear el siguiente. Cada planeta es un grupo de la tabla.</p></div>
      <div class="map-legend"><span class="pill next-pill">Siguiente parada: ${current === null ? '¡expedición completada!' : current === 'final' ? 'Prueba final' : GROUP[current].name}</span><span class="pill">${STAR(true)} ${totalStars}/24</span><span class="pill">Insignias ${nBadges}/${BADGES.length}</span>
      <button class="btn" data-go="practice">Práctica libre</button></div>
    </div>
    <div class="map-canvas">${mapBackdrop()}<svg class="map-path" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${lines}</svg>${hnode}${nodes}${boss}</div>`, 'map');
  $$('[data-locked]').forEach(b => b.addEventListener('click', () => {

/* ---------- 7.3 RESULTADOS de un minijuego ---------- */
function finishGame(g, game, rec, lines = [], extra = '') {
  const before = planetStars(g), finalBefore = finalUnlocked();
  const old = (S.games[g] || {})[game];
  const isBest = !old || better(rec, old);
  if (isBest) { S.games[g] = S.games[g] || {}; S.games[g][game] = rec; }
  save();
  const info = planetInfo(g);
  const i = ORDER.indexOf(g);
  let unlock = '';
  if (before < 1 && info.stars >= 1) {
    unlock = i < ORDER.length - 1 ? `¡Nuevo planeta desbloqueado: <b>${GROUP[ORDER[i + 1]].name}</b>!` : (!finalBefore ? '¡Has desbloqueado la <b>Prueba final</b>!' : '');
  }
  checkBadges();
  Sound.play(rec.pct >= 60 ? 'win' : 'bad');
  const nextGame = GAME_KEYS.find(k => !(S.games[g] || {})[k]);
  const G = GROUP[g];
  show(`
    <div class="card result" style="--gc:${G.color}">
      <p class="qtype">${GAMES[game].title} · ${G.name}</p>
      <h2>${rec.pct >= 95 ? '¡Impecable!' : rec.pct >= 80 ? '¡Muy bien!' : rec.pct >= 60 ? '¡Superado!' : 'Sigue practicando'}</h2>
      <div class="big-pct">${rec.pct} %</div>
      <div class="lines"><span class="pill">Tiempo ${fmt(rec.time)}</span><span class="pill">${rec.inTime ? '✓ Dentro del tiempo objetivo' : 'Fuera del tiempo objetivo (' + fmt(GAMES[game].target(elementsOf(g).length)) + ')'}</span>${lines.map(l => `<span class="pill">${l}</span>`).join('')}${isBest && old ? '<span class="pill" style="background:#e8f5ec;color:#0f5a2a">Nuevo récord</span>' : ''}</div>
      ${extra}
      <div><p class="muted">Estrellas del planeta</p>${starsHTML(info.stars, true)}<p class="muted" style="font-size:13px">${info.played < 3 ? `Te faltan ${3 - info.played} minijuego(s) para conseguir estrellas.` : `Media de los 3 minijuegos: ${Math.round(info.avg)} %`}</p></div>
      ${unlock ? `<p class="unlock">${unlock}</p>` : ''}
      <div class="actions">
        <button class="btn" data-go="${game}:${g}">Repetir</button>
        ${nextGame ? `<button class="btn primary" data-go="${nextGame}:${g}">Siguiente: ${GAMES[nextGame].title}</button>` : `<button class="btn primary" data-go="planet:${g}">Volver al planeta</button>`}
        <button class="btn" data-go="map">Mapa</button>
      </div>
    </div>`, 'result-screen');
}

/* ---------- 7.4 PAREJAS (memory) ---------- */
ROUTES.mem = function (g) {
  if (!GROUP[g] || !isUnlocked(g)) return go('map');
  const G = GROUP[g], els = elementsOf(g), n = els.length;
  const cards = shuffle(els.flatMap(e => [{ e, kind: 'name' }, { e, kind: 'sym' }]));
  const cols = n === 5 ? 5 : 4;
  const st = { moves: 0, matched: 0, first: null, lock: true, start: 0, up: new Set(), done: new Set() };
  const scr = show(`
    <div class="quiz-top">
      <button class="btn" data-go="planet:${g}">← Salir</button>
      <div class="quiz-title"><h2>Parejas · ${G.name}</h2><span class="muted">Empareja cada nombre con su símbolo.</span></div>
      <div class="quiz-stats"><span class="pill" id="mInfo">Memoriza…</span><span class="pill" id="mMoves">Movimientos: 0</span><span class="pill" id="mTime">0:00</span></div>
    </div>
    <div class="mgrid" style="--cols:${cols};--gc:${G.color}">
      ${cards.map((c, i) => `<button class="mcard up" data-i="${i}" aria-label="${c.kind === 'name' ? c.e.name : 'Símbolo ' + c.e.symbol}">
        <span class="in"><span class="face back"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="#fff"/><ellipse cx="12" cy="12" rx="11" ry="3.5" fill="none" stroke="#fff" stroke-width="1.6" transform="rotate(-20 12 12)"/></svg></span>
        <span class="face front">${c.kind === 'sym' ? `<small>Símbolo</small><span class="s">${c.e.symbol}</span>` : `<small>Nombre</small><span class="n">${c.e.name}</span>`}</span></span></button>`).join('')}
    </div>
    <div class="qfoot"><p class="feedback" id="mFb" role="status">Tienes unos segundos para ver todas las cartas.</p></div>`, 'mem');
  const btns = $$('.mcard', scr), fb = $('#mFb'), info = $('#mInfo');
  const setCard = (i, up) => { const b = btns[i], c = cards[i]; b.classList.toggle('up', up); b.setAttribute('aria-label', up ? (c.kind === 'name' ? c.e.name : 'Símbolo ' + c.e.symbol) : 'Carta boca abajo ' + (i + 1)); };
  let left = 4; info.textContent = `Memoriza… ${left}`;
  const cd = every(() => {
    left--; info.textContent = `Memoriza… ${left}`;
    if (left <= 0) {
      clearInterval(cd); btns.forEach((b, i) => setCard(i, false)); st.lock = false; st.start = performance.now();
      info.textContent = `Parejas: 0/${n}`; fb.textContent = 'Toca dos cartas: un nombre y su símbolo.'; Sound.play('flip');
      every(() => { $('#mTime').textContent = fmt((performance.now() - st.start) / 1000); }, 500);
    }
  }, 1000);
  scr.addEventListener('click', e => {
    const b = e.target.closest('.mcard'); if (!b || st.lock) return;
    const i = +b.dataset.i; if (st.done.has(i) || st.up.has(i)) return;
    setCard(i, true); st.up.add(i); Sound.play('flip');
    if (st.first === null) { st.first = i; return; }
    const a = st.first; st.first = null; st.moves++; $('#mMoves').textContent = 'Movimientos: ' + st.moves;
    const A = cards[a], B = cards[i];
    if (A.e === B.e && A.kind !== B.kind) {
      [a, i].forEach(k => { st.done.add(k); st.up.delete(k); btns[k].classList.add('matched'); btns[k].disabled = true; btns[k].setAttribute('aria-label', A.e.name + ' = ' + A.e.symbol + ', emparejada'); });
      st.matched++; info.textContent = `Parejas: ${st.matched}/${n}`; fb.className = 'feedback ok'; fb.textContent = `¡Bien! ${A.e.name} = ${A.e.symbol}`; Sound.play('match');
      if (st.matched === n) {
        st.lock = true; const time = (performance.now() - st.start) / 1000;
        const pct = Math.min(100, Math.round(100 * (n + 2) / st.moves));
        later(() => finishGame(g, 'mem', { pct, time: Math.round(time), inTime: time <= GAMES.mem.target(n), hints: 0, date: Date.now() }, [`${st.moves} movimientos`]), 700);
      }
    } else {
      // Error: mostramos la pareja correcta de cada carta durante 1,7 s
      st.lock = true; [a, i].forEach(k => btns[k].classList.add('wrong')); Sound.play('bad');
      const say = c => c.kind === 'name' ? `${c.e.name} → ${c.e.symbol}` : `${c.e.symbol} → ${c.e.name}`;
      fb.className = 'feedback bad'; fb.textContent = `No son pareja. Recuerda: ${say(A)} · ${say(B)}`;
      later(() => { [a, i].forEach(k => { btns[k].classList.remove('wrong'); setCard(k, false); st.up.delete(k); }); st.lock = false; }, 1700);
    }
  });
};

/* ---------- 7.5 MOTOR DE PREGUNTAS (ronda rápida, práctica, hidrógeno) ---------- */
function runQuiz(cfg) {
  // cfg: {title, sub, color, total, lives, perQ, hint, combo, next(st), onEnd(res), exit}
  const infinite = !isFinite(cfg.total);
  const st = { answered: 0, correct: 0, lives: cfg.lives || 0, streak: 0, maxStreak: 0, points: 0, time: 0, hints: 0, hintUsed: false, wrongs: [], seen: new Set(), locked: true, q: null, t0: 0, last: null, ended: false };
  const scr = show(`
    <div class="quiz-top">
      <button class="btn" id="qExit">← Salir</button>
      <div class="quiz-title"><h2>${cfg.title}</h2><span class="muted">${cfg.sub || ''}</span></div>
      <div class="quiz-stats">
        <span class="pill" id="qProg"></span>
        ${cfg.lives ? '<span class="pill lives" id="qLives"></span>' : ''}
        ${cfg.combo ? '<span class="pill combo" id="qCombo">Combo ×1</span><span class="pill" id="qPts">0 pts</span>' : ''}
      </div>
    </div>
    ${cfg.perQ ? '<div class="qtimer" id="qTimer" aria-hidden="true"><div id="qBar"></div></div>' : ''}
    <div class="card qcard" style="--gc:${cfg.color}"><p class="qtype" id="qType"></p><h3 class="qtext" id="qText"></h3></div>
    <div class="options" id="qOpts" role="group" aria-label="Opciones"></div>
    <div class="qfoot"><p class="feedback" id="qFb" role="status" aria-live="polite"></p>
      <div class="qfoot-actions">${cfg.hint ? '<button class="btn" id="qHint" title="Elimina dos opciones incorrectas (una vez por ronda)">Pista 50 %</button>' : ''}${infinite ? '<button class="btn" id="qEnd">Terminar</button>' : ''}</div></div>`, 'quiz');
  const opts = $('#qOpts'), fb = $('#qFb');
  $('#qExit').onclick = () => cfg.exit();
  if (infinite) $('#qEnd').onclick = () => finish();
  function stats() {
    $('#qProg').textContent = infinite ? `${st.correct}/${st.answered} aciertos` : `Pregunta ${Math.min(st.answered + 1, cfg.total)}/${cfg.total}`;
    if (cfg.lives) { const l = $('#qLives'); l.innerHTML = Array.from({ length: cfg.lives }, (_, i) => HEART(i < st.lives)).join(''); l.setAttribute('aria-label', `${st.lives} vidas`); l.setAttribute('role', 'img'); }
    if (cfg.combo) { $('#qCombo').textContent = `Combo ×${mult()}`; $('#qPts').textContent = `${st.points} pts`; }
  }
  const mult = () => Math.min(4, 1 + Math.floor(st.streak / 3));
  function ask() {
    let q; for (let k = 0; k < 15; k++) { q = cfg.next(st); if (!st.seen.has(q.sig)) break; }
    st.seen.add(q.sig); st.q = q; st.last = q.meta.el || null;
    $('#qType').textContent = TYPE_LABEL[q.type]; $('#qText').innerHTML = q.text;
    opts.innerHTML = q.options.map((o, i) => `<button class="opt${q.symOpts ? ' symopt' : ''}" data-i="${i}"><kbd>${i + 1}</kbd><span class="lbl">${o.label}</span></button>`).join('');
    fb.className = 'feedback'; fb.textContent = '';
    stats(); st.locked = false; st.t0 = performance.now();
    if (cfg.hint) $('#qHint').disabled = st.hintUsed;
    if (cfg.perQ) { $('#qBar').style.transform = 'scaleX(1)'; $('#qTimer').classList.remove('low'); }
  }
  opts.addEventListener('click', e => { const b = e.target.closest('.opt'); if (b && !b.disabled) answer(+b.dataset.i); });
  keyHandler = e => { if (/^[1-4]$/.test(e.key) && !e.ctrlKey && !e.altKey && !e.metaKey) { const b = opts.children[+e.key - 1]; if (b && !b.disabled) { e.preventDefault(); answer(+e.key - 1); } } };
  if (cfg.perQ) every(() => {
    if (st.locked || st.ended) return;
    const el = (performance.now() - st.t0) / 1000, f = Math.max(0, 1 - el / cfg.perQ);
    $('#qBar').style.transform = `scaleX(${f})`; $('#qTimer').classList.toggle('low', f < .3);
    if (el >= cfg.perQ) answer(-1);
  }, 100);
  if (cfg.hint) $('#qHint').onclick = () => {
    if (st.locked || st.hintUsed) return;
    st.hintUsed = true; st.hints++; $('#qHint').disabled = true;
    shuffle(st.q.options.map((o, i) => [o, i]).filter(([o]) => !o.ok)).slice(0, 2).forEach(([, i]) => { const b = opts.children[i]; b.disabled = true; b.classList.add('elim'); });
  };
  function answer(i) {
    if (st.locked || st.ended) return; st.locked = true;
    const dt = (performance.now() - st.t0) / 1000; st.time += cfg.perQ ? Math.min(dt, cfg.perQ) : dt;
    const q = st.q, ok = i >= 0 && q.options[i].ok; st.answered++;
    [...opts.children].forEach((b, k) => { b.disabled = true; if (q.options[k].ok) b.classList.add('ok'); else if (k === i) b.classList.add('bad'); });
    noteMiss(q.key, ok); noteStreak(ok);
    if (ok) {
      st.correct++; st.streak++; st.maxStreak = Math.max(st.maxStreak, st.streak);
      st.points += 100 * mult() + (cfg.perQ ? Math.round(Math.max(0, cfg.perQ - dt) * 5) : 0);
      fb.className = 'feedback ok'; fb.textContent = '¡Correcto! ' + q.explain; Sound.play('ok');
      if (cfg.combo && st.streak % 3 === 0) { const c = $('#qCombo'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }
    } else {
      st.streak = 0; if (cfg.lives) st.lives--; st.wrongs.push(q);
      fb.className = 'feedback bad'; fb.textContent = (i < 0 ? '¡Se acabó el tiempo! ' : 'No es correcto. ') + q.explain; Sound.play('bad');
    }
    announce(fb.textContent); stats(); save(); checkBadges();
    later(() => { if ((!infinite && st.answered >= cfg.total) || (cfg.lives && st.lives <= 0)) finish(); else ask(); }, ok ? 900 : 1800);
  }
  function finish() { if (st.ended) return; st.ended = true; st.locked = true; save(); cfg.onEnd({ ...st, died: !!cfg.lives && st.lives <= 0 }); }
  ask();
}

/* Ronda rápida de un planeta */
ROUTES.quiz = function (g) {
  if (!GROUP[g] || !isUnlocked(g)) return go('map');
  const types = shuffle(['sym2name', 'sym2name', 'sym2name', 'name2sym', 'name2sym', 'name2sym', 'elem2group', 'elem2group', 'group2num', 'notin']);
  runQuiz({
    title: `Ronda rápida · ${GROUP[g].name}`, sub: `Teclas 1–4 para responder · ${QUIZ_PER_Q} s por pregunta`, color: GROUP[g].color,
    total: 10, lives: 3, perQ: QUIZ_PER_Q, hint: true, combo: true,
    next: st => planetQuestion(g, types[st.answered], st.last),
    exit: () => go('planet', g),
    onEnd: r => {
      const pct = Math.round(100 * r.correct / 10);
      const wrongEls = [...new Set(r.wrongs.map(q => q.meta.el ? elLabel(q.meta.el) : (q.meta.out ? elLabel(q.meta.out) : GROUP[q.meta.g].name)))];
      finishGame(g, 'quiz', { pct, time: Math.round(r.time), inTime: !r.died && r.time <= GAMES.quiz.target(), hints: r.hints, date: Date.now() },
        [`${r.correct}/10 aciertos`, `Mejor racha ${r.maxStreak}`, `${r.points} pts`, ...(r.died ? ['Sin vidas'] : []), ...(r.hints ? ['Usaste pista'] : [])],
        wrongEls.length ? `<div><p class="muted" style="margin-bottom:6px">Repasa:</p><div class="wronglist">${wrongEls.map(w => `<span>${w}</span>`).join('')}</div></div>` : '');
    },
  });
};

/* ---------- 7.6 CONSTRUYE LA COLUMNA ---------- */
ROUTES.col = function (g) {
  if (!GROUP[g] || !isUnlocked(g)) return go('map');
  const G = GROUP[g], els = elementsOf(g), n = els.length;
  const st = { placed: new Set(), errors: new Set(), hints: 0, lock: false, start: performance.now(), done: false };
  const tray = shuffle(els);
  const scr = show(`
    <div class="quiz-top">
      <button class="btn" data-go="planet:${g}">← Salir</button>
      <div class="quiz-title"><h2>Construye la columna · ${G.name}</h2><span class="muted">Arrastra cada elemento a su periodo, o tócalo y después toca la casilla.</span></div>
      <div class="quiz-stats"><span class="pill" id="cTime">0:00</span><span class="pill" id="cErr">Errores: 0</span><button class="btn" id="cHint">Pista</button></div>
    </div>
    <div class="col-body" id="cRoot" style="--gc:${G.color}">
      <div class="colwrap">
        <div class="colhead">Grupo ${g}<br><b>${G.name}</b></div>
        ${g === 1 ? `<div class="hslot" aria-label="Hidrógeno, periodo 1, fuera del grupo"><b>H</b><span>Periodo 1 · Hidrógeno<br>(sin grupo, no es alcalino)</span></div>` : ''}
        ${els.map(e => `<button class="slot" data-drop="p${e.period}" aria-label="Periodo ${e.period}: vacía"><span class="per">Periodo ${e.period}</span><span class="tileholder"></span></button>`).join('')}
      </div>
      <div class="tray col-tray" aria-label="Elementos por colocar">
        ${tray.map(e => `<button class="chip" data-item="${e.symbol}" aria-label="${e.name}, ${e.symbol}"><b>${e.symbol}</b><small>${e.name}</small></button>`).join('')}
      </div>
    </div>
    <div class="qfoot"><p class="feedback" id="cFb" role="status" aria-live="polite">Ordena de arriba (periodo menor) a abajo (periodo mayor).</p></div>`, 'col');
  const root = $('#cRoot'), fb = $('#cFb');
  every(() => { if (!st.done) $('#cTime').textContent = fmt((performance.now() - st.start) / 1000); }, 500);
  const slotOf = p => root.querySelector(`[data-drop="p${p}"]`);
  const dnd = attachDnD(root, {
    isLocked: () => st.lock || st.done,
    onDrop(sym, target) {
      const e = BY_SYMBOL[sym]; if (!e || !target.startsWith('p')) return;
      const p = +target.slice(1), slot = slotOf(p);
      if (slot.classList.contains('filled')) return;
      if (p === e.period) {
        st.placed.add(sym); noteMiss(sym, true);
        slot.classList.add('filled'); slot.removeAttribute('data-drop'); slot.setAttribute('aria-label', `Periodo ${p}: ${e.name}, ${e.symbol}`);
        slot.querySelector('.tileholder').innerHTML = `<span class="sym">${e.symbol}</span><span>${e.name}</span>`;
        const chip = root.querySelector(`[data-item="${sym}"]`); if (chip) chip.remove();
        fb.className = 'feedback ok'; fb.textContent = `¡Bien! ${e.name} está en el periodo ${p}.`; Sound.play('ok');
        const next = root.querySelector('.chip'); if (next) next.focus({ preventScroll: true }); else slot.focus();
        if (st.placed.size === n) done();
      } else {
        st.errors.add(sym); noteMiss(sym, false); st.lock = true; $('#cErr').textContent = `Errores: ${st.errors.size}`;
        slot.classList.add('wrong'); const right = slotOf(e.period); right && right.classList.add('target');
        fb.className = 'feedback bad'; fb.textContent = `No. El ${e.name} (${e.symbol}) va en el periodo ${e.period}.`; announce(fb.textContent); Sound.play('bad');
        later(() => { slot.classList.remove('wrong'); right && right.classList.remove('target'); st.lock = false; const c = root.querySelector(`[data-item="${sym}"]`); if (c) c.focus({ preventScroll: true }); }, 1700);
      }
    },
  });
  $('#cHint').onclick = () => {
    if (st.lock || st.done) return;
    let sym = dnd.selected; if (!sym) { const c = root.querySelector('.chip'); if (!c) return; sym = c.dataset.item; dnd.select(sym); }
    st.hints++; const s = slotOf(BY_SYMBOL[sym].period); s.classList.add('target');
    fb.className = 'feedback'; fb.textContent = `Pista: el ${BY_SYMBOL[sym].name} va en la casilla resaltada.`;
    later(() => s.classList.remove('target'), 1600);
  };
  function done() {
    st.done = true; const time = (performance.now() - st.start) / 1000;
    const pct = Math.round(100 * (n - st.errors.size) / n);
    later(() => finishGame(g, 'col', { pct, time: Math.round(time), inTime: time <= GAMES.col.target(n), hints: st.hints, date: Date.now() },
      [`${n - st.errors.size}/${n} a la primera`, ...(st.hints ? [`${st.hints} pista(s)`] : [])]), 700);
  }
};

/* ---------- 7.7 PRUEBA FINAL ---------- */
const COL = { 1: 2, 2: 3, 13: 5, 14: 6, 15: 7, 16: 8, 17: 9, 18: 10 };
// Guiones opcionales (&shy;) para que los nombres largos se partan bien en columnas estrechas
const SHY = { 'Alcalinotérreos': 'Alcalino&shy;térreos', 'Carbonoideos': 'Carbo&shy;noideos', 'Pnictógenos': 'Pnictó&shy;genos', 'Halógenos': 'Haló&shy;genos', 'Anfígenos': 'Anfí&shy;genos' };
const shy = n => SHY[n] || n;
ROUTES.final = function () {
  if (!finalUnlocked()) return go('map');
  // cell[i] = símbolo colocado en la casilla del elemento i ; lab[g] = índice de etiqueta colocada en la columna g
  const labOrder = shuffle(ORDER);
  const st = { cell: {}, lab: {}, start: performance.now(), done: false, symOrder: shuffle(ELEMENTS.map(e => e.symbol)) };
  const scr = show(`
    <div class="quiz-top">
      <button class="btn" id="fExit">← Mapa</button>
      <div class="quiz-title"><h2>Prueba final</h2><span class="muted">Coloca los 44 símbolos y pon a cada columna su nombre de grupo. Arrastra, o toca y coloca.</span></div>
      <div class="quiz-stats"><span class="pill" id="fTime">${fmt(FINAL_LIMIT)}</span><span class="pill" id="fCount">0/${FINAL_TOTAL}</span><button class="btn primary" id="fDone">Corregir</button></div>
    </div>
    <div class="final-body" id="fRoot"><div class="ptable" id="ptable"></div><aside class="side" id="side"></aside></div>`, 'final');
  const root = $('#fRoot');
  const placedAt = sym => { for (const k in st.cell) if (st.cell[k] === sym) return +k; return null; };
  const labelAt = li => { for (const k in st.lab) if (st.lab[k] === li) return +k; return null; };
  function render(focusDrop) {
    let h = '';
    for (let p = 1; p <= 7; p++) h += `<div class="pnum" style="grid-column:1;grid-row:${p + 2}" aria-hidden="true">${p}</div>`;
    ORDER.forEach(g => {
      const G = GROUP[g], li = st.lab[g], c = COL[g];
      h += `<div class="gnum" style="grid-column:${c};grid-row:1;--gc:${G.color}">${g}</div>`;
      let cls = 'lslot' + (li !== undefined ? ' filled' : ''), inner = li !== undefined ? shy(GROUP[labOrder[li]].name) : '<span class="ph" aria-hidden="true">?</span>';
      if (st.done) { const ok = li !== undefined && labOrder[li] === g; cls += ok ? ' ok' : ' bad'; inner = ok ? shy(G.name) : `${li !== undefined ? `<s>${shy(GROUP[labOrder[li]].name)}</s>` : ''}<span>${shy(G.name)}</span>`; }
      h += `<button class="${cls}" style="grid-column:${c};grid-row:2;--gc:${G.color}" ${st.done ? 'disabled' : `data-drop="l:${g}"`} ${li !== undefined && !st.done ? `data-item="g:${li}"` : ''}
        aria-label="Nombre de la columna del grupo ${g}: ${li !== undefined ? GROUP[labOrder[li]].name : 'vacía'}">${inner}</button>`;
    });
    ELEMENTS.forEach((e, i) => {
      const sym = st.cell[i], col = e.group === null ? 2 : COL[e.group];
      let cls = 'pcell' + (sym ? ' filled' : '') + (e.group === null ? ' hcell' : ''), inner = sym || '';
      if (st.done) { const ok = sym === e.symbol; cls += ok ? ' ok' : ' bad'; inner = ok ? sym : `${sym ? `<s>${sym}</s>` : ''}<b>${e.symbol}</b>`; }
      const where = e.group === null ? 'Casilla del periodo 1 separada, sin grupo' : `Grupo ${e.group}, periodo ${e.period}`;
      h += `<button class="${cls}" style="grid-column:${col};grid-row:${e.period + 2};--gc:${colorOf(e)}" ${st.done ? 'disabled' : `data-drop="c:${i}"`} ${sym && !st.done ? `data-item="s:${sym}"` : ''}
        aria-label="${where}: ${sym || 'vacía'}${st.done && sym !== e.symbol ? '. Correcto: ' + e.symbol : ''}">${inner}</button>`;
    });
    $('#ptable').innerHTML = h;
    if (!st.done) {
      const syms = st.symOrder.filter(s => placedAt(s) === null), labs = labOrder.map((_, i) => i).filter(i => labelAt(i) === null);
      $('#side').innerHTML = `
        <h3>Símbolos (${syms.length})</h3>
        <div class="tray final-tray" data-drop="tray" aria-label="Bandeja de símbolos">${syms.map(s => `<button class="tchip" data-item="s:${s}" aria-label="Símbolo ${s}">${s}</button>`).join('') || '<span class="muted">¡Todos colocados!</span>'}</div>
        <h3>Nombres de grupo (${labs.length})</h3>
        <div class="tray final-tray" data-drop="tray" aria-label="Bandeja de nombres">${labs.map(i => `<button class="lchip" data-item="g:${i}">${GROUP[labOrder[i]].name}</button>`).join('') || '<span class="muted">¡Todos colocados!</span>'}</div>
        <p class="muted" style="font-size:13px">Puedes mover lo que ya has colocado. Con teclado: Intro para elegir y colocar, Supr para devolver a la bandeja, Esc para cancelar.</p>`;
      const n = Object.keys(st.cell).length + Object.keys(st.lab).length; $('#fCount').textContent = `${n}/${FINAL_TOTAL}`;
    }
    if (focusDrop) { const el = root.querySelector(`[data-drop="${focusDrop}"]`) || root.querySelector('.tchip, .lchip'); if (el) el.focus({ preventScroll: true }); }
  }
  attachDnD(root, {
    trayId: 'tray', isLocked: () => st.done,
    onDrop(item, target) {
      const [kind, v] = [item.slice(0, 1), item.slice(2)];
      if (kind === 's') {
        const from = placedAt(v);
        if (target === 'tray') { if (from !== null) delete st.cell[from]; }
        else if (target.startsWith('c:')) {
          const to = +target.slice(2); if (to === from) return;
          const occ = st.cell[to]; st.cell[to] = v;
          if (from !== null) { if (occ) st.cell[from] = occ; else delete st.cell[from]; }
        } else return;
      } else {
        const li = +v, from = labelAt(li);
        if (target === 'tray') { if (from !== null) delete st.lab[from]; }
        else if (target.startsWith('l:')) {
          const to = +target.slice(2); if (to === from) return;
          const occ = st.lab[to]; st.lab[to] = li;
          if (from !== null) { if (occ !== undefined) st.lab[from] = occ; else delete st.lab[from]; }
        } else return;
      }
      Sound.play('tap'); render(target === 'tray' ? null : target);
    },
  });
  $('#fExit').onclick = async () => { if (await confirmDialog('¿Salir de la prueba?', 'Perderás lo que has colocado en esta partida.', 'Salir')) go('map'); };
  $('#fDone').onclick = async () => {
    const n = Object.keys(st.cell).length + Object.keys(st.lab).length;
    if (n < FINAL_TOTAL && !(await confirmDialog('¿Corregir ya?', `Aún te quedan ${FINAL_TOTAL - n} por colocar. Las casillas vacías contarán como fallo.`, 'Corregir'))) return;
    grade(false);
  };
  every(() => {
    if (st.done) return; const left = FINAL_LIMIT - (performance.now() - st.start) / 1000;
    $('#fTime').textContent = fmt(left); if (left <= 0) { if ($('#dlg').open) $('#dlg').close('no'); grade(true); }
  }, 250);
  function grade(timeout) {
    if (st.done) return; st.done = true;
    const time = Math.min(FINAL_LIMIT, (performance.now() - st.start) / 1000);
    let score = 0;
    ELEMENTS.forEach((e, i) => { const ok = st.cell[i] === e.symbol; if (ok) score++; noteMiss(e.symbol, ok); });
    ORDER.forEach(g => { const ok = st.lab[g] !== undefined && labOrder[st.lab[g]] === g; if (ok) score++; noteMiss('g' + g, ok); });
    const rec = { score, total: FINAL_TOTAL, time: Math.round(time), date: Date.now() };
    const isBest = !S.final || score > S.final.score || (score === S.final.score && rec.time < S.final.time);
    if (isBest) S.final = rec; save(); checkBadges();
    render(); Sound.play(score >= FINAL_TOTAL * .6 ? 'win' : 'bad');
    const pct = Math.round(100 * score / FINAL_TOTAL);
    $('#fDone').disabled = true; $('#fExit').onclick = () => go('map');
    $('#side').innerHTML = `
      <div class="card result" style="margin:0;padding:18px">
        <p class="qtype" style="--gc:#0055cc">${timeout ? '¡Tiempo!' : 'Corrección'}</p>
        <div class="big-pct">${score}/${FINAL_TOTAL}</div>
        <div class="lines"><span class="pill">${pct} %</span><span class="pill">Tiempo ${fmt(time)}</span>${isBest ? '<span class="pill" style="background:#e8f5ec;color:#0f5a2a">Mejor resultado</span>' : ''}</div>
        ${starsHTML(pct >= 95 ? 3 : pct >= 80 ? 2 : pct >= 60 ? 1 : 0, true)}
        <p class="muted">En <b style="color:var(--red)">rojo</b>, las casillas falladas con la respuesta correcta. Tachado, lo que habías puesto.</p>
        <div class="actions"><button class="btn primary" data-go="final">Repetir</button><button class="btn" data-go="practice">Practicar fallos</button><button class="btn" data-go="map">Mapa</button></div>
      </div>`;
    announce(`Prueba corregida: ${score} de ${FINAL_TOTAL}.`);
  }
  render();
};

/* ---------- 7.9 HIDRÓGENO ---------- */

        if (r.correct === 3) { S.hDone = true; save(); }
        Sound.play(r.correct === 3 ? 'win' : 'bad');
        show(`<div class="card result"><p class="qtype" style="--gc:${H_COLOR}">Mini reto · Hidrógeno</p><h2>${r.correct === 3 ? '¡Perfecto!' : 'Casi'}</h2><div class="big-pct">${r.correct}/3</div>
          <p class="muted">Recuerda: H = Hidrógeno, y no pertenece a ningún grupo.</p>
          <div class="actions"><button class="btn" data-go="hydrogen">Repetir</button><button class="btn primary" data-go="map">Mapa</button></div></div>`, 'result-screen');
      },
    });
  };
};

/* ---------- 7.10 LOGROS ---------- */
ROUTES.achievements = function () {
  const totalStars = ORDER.reduce((a, g) => a + planetStars(g), 0);
  show(`
    <div class="bar"><div class="grow"><h1>Logros</h1><p class="muted">Insignias conseguidas: ${Object.keys(S.badges).length} de ${BADGES.length}</p></div><button class="btn" data-go="map">← Mapa</button></div>
    <div class="stats"><span class="pill">${STAR(true)} Estrellas ${totalStars}/24</span><span class="pill">Mejor racha: ${S.bestStreak}</span><span class="pill">Racha actual: ${S.streak}</span>
      <span class="pill">Prueba final: ${S.final ? `${S.final.score}/${S.final.total}` : '—'}</span><span class="pill">Hidrógeno: ${S.hDone ? '✓' : '—'}</span></div>
    <div class="badges">${BADGES.map(b => { const on = !!S.badges[b.id]; return `<article class="card badge${on ? '' : ' off'}">${b.icon}<div><h3>${b.title}</h3><p>${b.desc}</p><p style="font-size:12px;margin-top:2px">${on ? '✓ Conseguida el ' + new Date(S.badges[b.id]).toLocaleDateString('es-ES') : 'Pendiente'}</p></div></article>`; }).join('')}</div>`, 'achievements');
};

/* ===================== 8. ARRANQUE ===================== */
function syncSound() {
  const b = $('#btnSound'); b.setAttribute('aria-pressed', String(!!S.sound));
  $('#soundLbl').textContent = S.sound ? 'Sonido: sí' : 'Sonido: no'; b.setAttribute('aria-label', S.sound ? 'Desactivar sonido' : 'Activar sonido');
  b.querySelector('.w').style.display = S.sound ? '' : 'none'; b.querySelector('.x').style.display = S.sound ? 'none' : '';
}
$('#btnSound').onclick = () => { S.sound = !S.sound; save(); syncSound(); Sound.play('ok'); };
$('#btnReset').onclick = async () => {
  if (await confirmDialog('¿Reiniciar el progreso?', 'Se borrarán estrellas, insignias, récords y fallos guardados en este dispositivo. No se puede deshacer.', 'Reiniciar')) {
    const sound = S.sound; S = defaultState(); S.sound = sound; save(); go('map'); toast('<b>Progreso reiniciado</b>Empieza de nuevo por los Alcalinos.');
  }
};
const TEST = selfTest();
if (!TEST.ok) { const b = $('#testBanner'); b.hidden = false; b.textContent = 'Aviso para el profesorado: la autocomprobación del contenido ha fallado. ' + TEST.errors.slice(0, 3).join(' '); }
syncSound();
go('map');
// Acceso para depurar o ampliar desde la consola
window.EP = { get state() { return S; }, ELEMENTS, GROUPS, selfTest, go, Q, save };
</script>
